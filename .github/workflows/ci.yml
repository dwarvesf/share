name: CI

# Public repo: GitHub-hosted runners are free here. Never move a public repo onto
# the self-hosted pool, since a fork PR would run its code on that machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. On main every merge keeps its run, so parallel
  # sub-goals that merge back to back do not cancel each other's main check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skip the slow suite a change cannot affect. A Share Bar change (mac/ only) skips the bash
  # suite; a CLI change skips the Swift job. Unknown diffs and workflow edits run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      bash: ${{ steps.f.outputs.bash }}
      mac: ${{ steps.f.outputs.mac }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          run_all() { { echo bash=true; echo mac=true; } >>"$GITHUB_OUTPUT"; exit 0; }
          files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) || run_all
          [ -n "$files" ] || run_all
          printf '%s\n' "$files"
          ! grep -q '^\.github/' <<<"$files" || run_all
          # tests/share.sh reads CLI.swift, so that file still runs the bash suite
          mac_only='^(mac/|docs/verification/share-bar/|docs/implementation-notes/share-bar\.md$)'
          if grep -qvE "$mac_only" <<<"$files" || grep -qx 'mac/Sources/ShareBarCore/CLI.swift' <<<"$files"; then
            echo bash=true >>"$GITHUB_OUTPUT"
          else
            echo bash=false >>"$GITHUB_OUTPUT"
          fi
          if grep -q '^mac/' <<<"$files"; then echo mac=true >>"$GITHUB_OUTPUT"; else echo mac=false >>"$GITHUB_OUTPUT"; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: shellcheck bin/handout install.sh tests/share.sh tests/members.sh tests/e2e.sh tests/ci/*.sh demo/render.sh mac/*.sh
      # Every suite section runs in exactly one PR shard (tests/ci/shards.txt); a new section must join one.
      - run: bash tests/ci/shard-check.sh
      - run: bash tests/ci/shard-check-test.sh

  # A pull request runs the suite as shards on Ubuntu (tests/ci/shards.txt), so its wall time is the longest shard.
  # `chain` cannot shrink: the core, r2, groundwork and late groups share state. macOS runs the whole suite on main only,
  # and one cheap shard plus a bash 3.2 parse check on pull requests (job test-macos).
  test:
    needs: changes
    if: needs.changes.outputs.bash == 'true' && github.event_name == 'pull_request'
    # A hung check fails here instead of holding the job for the 6 h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [chain, members-a, members-b]
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: 2.11.4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install caddy and pandoc
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" caddy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          sudo apt-get install -y --no-install-recommends pandoc >/dev/null

      - name: Self-test (shard ${{ matrix.shard }})
        run: bash tests/ci/run-shard.sh "${{ matrix.shard }}"

  # macOS on a pull request: the bash 3.2 parse check and one standalone shard, sized to finish before the Ubuntu chain.
  test-macos:
    needs: changes
    if: needs.changes.outputs.bash == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse under the system bash 3.2
        run: /bin/bash -n bin/handout && /bin/bash -n install.sh

      - name: Install caddy and pandoc
        run: brew install caddy pandoc

      - name: Self-test (shard members-b)
        run: bash tests/ci/run-shard.sh members-b

  # A push to main runs every shard on both OSes, so its wall time is the longest shard, not the
  # whole suite (unsharded, macOS took 23 to 30 min and hit the old 30 min limit).
  test-full:
    needs: changes
    if: needs.changes.outputs.bash == 'true' && github.event_name == 'push'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [chain, members-a, members-b]
    runs-on: ${{ matrix.os }}
    env:
      CADDY_VERSION: 2.11.4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install caddy and pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" caddy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          sudo apt-get install -y --no-install-recommends pandoc >/dev/null

      - name: Install caddy and pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install caddy pandoc

      - name: Self-test (shard ${{ matrix.shard }})
        run: bash tests/ci/run-shard.sh "${{ matrix.shard }}"

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test
        run: swift test --package-path mac

      - name: Build (unsigned, ad-hoc)
        run: bash mac/build.sh 0.0.0
