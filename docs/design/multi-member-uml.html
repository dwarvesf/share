# share system design

`share` is one bash CLI (`bin/share`, v0.9 line) that publishes a file, folder or local port at `https://<host>/<id>/`. A tenant is one hostname with one origin machine: Caddy serves the origin's links through a named Cloudflare tunnel, and when R2 is on, a tenant Worker on the same hostname serves cloud links from a private R2 bucket and passes everything else to the tunnel. Teammates publish cloud links only, with a bucket-scoped token the admin makes by hand.

Rev A was the backfill of the system as built (`docs/research/2026-11-13-current-state-machines.md`). Rev B is the multi-member design from `docs/briefs/DECISION-BRIEF-multi-member.md` (r2): members serve links from their own machines behind the same hostname, through one Workers VPC binding each, with a member registry in the bucket and tool-minted credentials redeemed once. Nothing in rev B is built.

## Use cases

Rev B adds the machine member (violet, shown as Member) and the admin's member verbs. A member reaches the system only through a code, `join`, its publishing verbs and `leave`; every member verb is the admin's. Blue is the admin, green a cloud-only publisher (today's R5), violet a machine member, gray the visitor.

## Components

Rev B adds a member machine (violet lane, bottom left) that runs its own Caddy and cloudflared on a tunnel with no hostname. The Worker reaches it through a Workers VPC Service bound as `M_<8hex>`, so the hostname stays one. Lanes are where a piece runs: blue the origin, amber the Cloudflare edge, gray the Cloudflare account, green a cloud-only publisher, violet a machine member. Admin verbs need only the admin token and the hostname, so they run from any machine.

## Sequences

A local add on an R2-on origin writes the pointer before any byte is served, so the Worker passes the id to the tunnel from the first request. The row append and the Caddy reload come last, under the index lock.

type: sequence
title: add on the origin (tunnel, R2 on)
level: L3
participants:
  - {name: Owner, tone: blue}
  - {name: share CLI, tone: blue}
  - Keychain
  - {name: R2 bucket, tone: violet}
  - {name: Caddy, tone: blue}

  - {from: share CLI, to: Keychain, text: r2_token_check, kind: call}
  - {from: Keychain, to: share CLI, text: publisher token, kind: return}

`member add` runs under the admin lease and in the one write order: the record says `adding` first, then every Cloudflare object, then the record says `invited`. A die anywhere leaves `adding`, and the rerun on the same name resumes, finding the token by name. Blue is the admin side, gray Cloudflare, violet the bucket.

`member rm` cuts routing first: the redeploy without `M_<8hex>` makes every machine link of that member 404 at once, before any object is deleted. Each of its v:3 links becomes a tombstone, so the bytes on its machine are never touched from outside. Cloud links stay until they expire.

type: sequence
title: member rm (admin)
level: L3
review:
  - The tombstones of a removed member are swept after 30 days by LastModified. Is 30 days right when the machine may never come back?
  - Should `member rm` refuse while the member is ONLINE and has links, or always proceed?

  - {name: Admin, tone: blue}
  - {name: share CLI, tone: blue}
  - {name: R2 bucket, tone: violet}
  - {name: Cloudflare API, tone: gray}

A member link reaches its machine through the VPC binding, never through the tenant's tunnel. Worker v5 checks expiry on every pointer, answers 503 for a paused member, and 404 when the binding is gone. Spike O1 showed request headers pass through a binding unchanged, so the Worker strips Access headers itself; the Host stays the tenant hostname, streaming works, and the hop adds 150 to 350 ms.

When the admin removes a member's link, the admin cannot reach the member's disk. It writes a tombstone and deletes the pointer, so the link 404s at once. The owner's next hourly reconcile flags the row revoked, drops its Caddy handle and deletes the tombstone; the bytes wait for the owner's own `rm` or the row's expiry.

## State machines

A profile is exactly one role, derived from its config at load. R4 lasts only for the admin setup run; its saved config is the same shape as R5. R6 is not a flag, only an R2-shaped config with an empty index and `index.migrated`. Rev B adds R7: a member profile, written only by `join <code>` and removed by `leave` or `leave --local`.

```uml
id: sm-profile
type: state
title: Profile role (R0 to R7)
level: L4
review:
  - Is a member profile its own role R7, or an R5 profile plus `member_id`? Every `r2on` site (28) needs a member behavior either way.
states:
  - {name: R1 quick, at: [1, 0]}
  - {name: R0 none, initial: true, at: [1, 1]}
  - {name: R2 origin R2 off, at: [2, 1]}
  - {name: R3 origin R2 on, at: [3, 1]}
  - {name: R6 migrated away, final: true, at: [2, 2]}
  - {name: R4 r2 admin, at: [0, 3]}
  - {name: R5 r2 publisher, at: [1, 3]}
  - {name: R7 member, at: [0, 0], tone: violet}
transitions:
  - {from: R0 none, to: R1 quick, event: setup --quick}
  - {from: R1 quick, to: R0 none, event: teardown}
  - {from: R0 none, to: R2 origin R2 off, event: "setup <host>"}
  - {from: R2 origin R2 off, to: R0 none, event: teardown}
  - {from: R2 origin R2 off, to: R3 origin R2 on, event: setup --r2 --bucket B}
  - {from: R3 origin R2 on, to: R2 origin R2 off, event: setup --no-r2, guard: no alias}
  - {from: R3 origin R2 on, to: R0 none, event: teardown, guard: tenant objects stay}

## Cross-cutting concepts

- One origin per tenant becomes one origin per pointer. A v:2 pointer is the tenant origin's; a v:3 pointer names its member origin. Every reconcile acts on its own origin's pointers only.
- The deploy is authoritative; the registry is a journal. Routing lives in the Worker deploy (one `M_<8hex>` binding per machine member, the `PAUSED` var). Every deploy body is rebuilt from the registry plus the marker, so no path drops a binding. Admin status flows deploy to record only; `member ls` reports drift and `member sync` repairs it.
- One write order for every member status change: record intent (`status=<verb>ing`, If-Match), then the Cloudflare change, then the record final. A die leaves an `...ing` status that the rerun resumes.
- Every admin verb takes the admin lease `lock/admin` (`If-None-Match: *`, holder and expiry inside; a stale lease is taken over with `If-Match`). Two admin shells cannot lose a binding.
- Tombstones never delete bytes. Removing someone else's link writes `t/<id>` and deletes the pointer; only the owner's own `rm` or the row's expiry deletes bytes.
- Caddy serves listed rows only: one `handle /<id>/*` per live, non-revoked row, on the origin and on members. Unlisted or revoked bytes are unreachable.
- Conditional writes in R2 (`If-None-Match: *`, `If-Match`) stay the only cross-machine concurrency control. Local symlink locks (`index`, `host`, `add-<id>`) hold within one profile on one machine.
- Publishing is the record PUT. Bytes always go to a fresh prefix `o/<id>.<nonce8>/`; nothing overwrites bytes in place, and a refresh swaps the record with `If-Match`.
- Refuse before the first write. Every multi-step setup checks all guards first, and a rerun converges, skipping each step already in place.
- The Worker fails closed for cloud ids (any doubt is 404), enforces `expires` on every pointer, and passes v:2 pointers and non-id paths to the origin unchanged.
- The admin token and the minter token live in 1Password and the environment only, never stored by share. Member tokens are minted by the tool, sealed into a one-time invite, and kept in the member's Keychain.

## Risks and technical debt

- Workers VPC is beta. Bites if Cloudflare changes the binding API, its pricing, or loopback routing to a tunnel. Mitigated by shipping members behind `--members` only, with cloud-only members as the fallback. Spike O1 passed live on a Free-plan account (VPC Service to 127.0.0.1 over a tunnel with only the 404 catch-all, no warp-routing, 150 to 350 ms).
- Every member serves under one origin. Bites if one member's page reads another member's link or cookies through same-origin script. Mitigated by stripping Access headers and cookies before a binding fetch; not by isolation.
- The bucket token cannot tell members apart. Bites if a member token leaks or a teammate errs: it can write any `u/`, `m/` or `t/` key. Mitigated by making the worst case visible and recoverable: a forged tombstone revokes a link the owner can see and re-add, a forged pointer cannot serve an unlisted or revoked row, a forged record cannot change routing. Worker-mediated writes are the upgrade before anyone outside the team publishes.
- Open (spike O2): minting member tokens by API is unproven. Neither stored token may list account tokens (403), so a minter token scoped to one R2 bucket, and extending `expires_on` in place, are both untested. Bites at `member add`: without it the admin hand-makes each member token as today. Closes with the O2 spike against the tokens API.
- A member's connector token never expires. Bites if it leaks: another machine can join that tunnel and take a share of the requests. Mitigated by `rotate` (connections dropped first) and the "extra connector" flag in `member ls`.
- `by` is an unauthenticated `uname -n`, and any publisher may rm any cloud link. Bites if a publisher token leaks or a teammate errs. Mitigated only by ADR-0007's named-teammates rule.
- The origin's hourly prune still runs with no token. Bites as orphan pointers and expired cloud records that wait for an interactive `ls` or `prune` on the origin. Members run their reconcile unattended; the origin does not.
- A record of an unknown version blocks the orphan sweep of every CLI that cannot read it. Bites on the first new record version. Mitigated in the groundwork: records with `storage:"machine"` of any version no longer block the sweep, and `min_cli` names the floor.
- `teardown` on an R2-on origin removes the tunnel and DNS but leaves the route, Worker, pointers and marker. Bites as a half-torn tenant; refused on T2 while member records exist.</script>

# share system design

`share` is one bash CLI (`bin/share`, v0.9 line) that publishes a file, folder or local port at `https://<host>/<id>/`. A tenant is one hostname with one origin machine: Caddy serves the origin's links through a named Cloudflare tunnel, and when R2 is on, a tenant Worker on the same hostname serves cloud links from a private R2 bucket and passes everything else to the tunnel. Teammates publish cloud links only, with a bucket-scoped token the admin makes by hand.

This revision is the backfill: the system as built, read from `docs/research/2026-11-13-current-state-machines.md` (line cites into `bin/share` at 4564c5c). Nothing here is new.

## Cross-cutting concepts

- One origin per tenant. Every v:2 pointer is the origin's own, and its reconcile reaps any pointer with no local row after 10 minutes.
- Conditional writes in R2 (`If-None-Match: *`, `If-Match`) are the only cross-machine concurrency control. Local symlink locks (`index`, `host`, `add-<id>`) hold within one profile on one machine.
- Publishing is the record PUT. Bytes always go to a fresh prefix `o/<id>.<nonce8>/`; nothing overwrites bytes in place, and a refresh swaps the record with `If-Match`.
- Refuse before the first write. Every multi-step setup checks all guards first, and a rerun converges, skipping each step already in place.
- The Worker fails closed for cloud ids (any doubt is 404) and passes v:2 pointers and non-id paths to the origin unchanged.
- The admin token lives in the environment only and is never stored; a publisher token is bucket-scoped and lives in the Keychain.

## Risks and technical debt

- Caddy serves the whole `pub/` tree. Bites when an add dies between `stage_publish` and the row append: the bytes stay reachable with no row, and no sweep removes them. No mitigation.
- `by` is an unauthenticated `uname -n`, and any publisher may rm any cloud link. Bites if a publisher token leaks or a teammate errs. Mitigated only by ADR-0007's named-teammates rule.
- The hourly prune runs with no token. Bites as orphan pointers and expired cloud records that wait for someone's interactive `ls` or `prune`. Machine-link expiry is enforced only by the origin's prune, never by the Worker.
- One origin machine holds the tunnel token and is the only place the Worker redeploys from. Bites when that machine is lost: links go offline and the admin cannot redeploy from elsewhere.
- A record of an unknown version blocks the orphan sweep of every CLI that cannot read it. Bites on the first new record version. `WORKER_RECORD_V` is dead code.
- `teardown` on an R2-on origin removes the tunnel and DNS but leaves the route, Worker, pointers and marker. Bites as a half-torn tenant; cleaned only by hand or `--purge` from an r2 admin profile.</script>

// The whole pipeline. nodes [{id, w, h, at, lane}], edges [{v, w, lines, lw, via, route}].
// o: {dir, lanes, gutterW, gutterH, margin, alignTop, warn, lineH, obstacles(G) -> rects}.
// Returns {cell, box, routes, W, H, G}. Labels that cannot find a clear spot widen the gutters around them.
function layoutGraph(nodes, edges, o) {
  o = o || {};

  const count = {};

    if (!p) return;
    const e = ok[i], A = cell[e.v], B = cell[e.w];
    if (p.t === 'h' && Math.abs(A[0] - B[0]) === 1) gc[Math.max(A[0], B[0])] = Math.max(gc[Math.max(A[0], B[0])], (e.lw || 0) + 30);
    if (p.t === 'v' && Math.abs(A[1] - B[1]) === 1) gr[Math.max(A[1], B[1])] = Math.max(gr[Math.max(A[1], B[1])], e.lines.length * LH + 22);
    if (p.cg != null) count['c' + p.cg] = (count['c' + p.cg] || 0) + 1;
    if (p.rg != null) count['r' + p.rg] = (count['r' + p.rg] || 0) + 1;
  });
  Object.keys(count).forEach(k => { const g = +k.slice(1), need = count[k] * 12 + 28; if (k[0] === 'c') gc[g] = Math.max(gc[g], need); else gr[g] = Math.max(gr[g], need); });
  let G, routes, fails = [];
  for (let round = 0; round < 7; round++) {
    G = geometry(nodes, cell, gc, gr, o);
    routes = pixelize(ok, plans, cell, G);
    separate(routes, ok, G, 12);
    const obs = Object.keys(G.box).map(id => { const b = G.box[id]; return { x: b.x - 3, y: b.y - 3, w: b.w + 6, h: b.h + 6 }; }).concat(o.obstacles ? o.obstacles(G) : []);
    // A label on top of another edge's line widens its gutter only in the first rounds; a label on a box always does.
    fails = placeLabels(ok, routes, G, obs, LH).filter(f => !f.soft || round < 2);
    if (!fails.length) break;
    // Widen each gutter a failed label overlaps (once per round), then lay out again.
    const wc = {}, wr = {};
    fails.forEach(f => {
      const r = f.rect;
      for (let g = 0; g <= G.nc; g++) {
        const x0 = g === 0 ? 0 : G.cx[g - 1] + G.cw[g - 1], x1 = g === G.nc ? G.W : G.cx[g];
        if (r.x < x1 && r.x + r.w > x0) wc[g] = 1;
      }
      for (let g = 0; g <= G.nr; g++) {
        const y0 = g === 0 ? 0 : G.ry[g - 1] + G.rh[g - 1], y1 = g === G.nr ? G.H : G.ry[g];
        if (r.y < y1 && r.y + r.h > y0) wr[g] = 1;
      }
    });
    Object.keys(wc).forEach(g => { gc[g] += 30; });
    Object.keys(wr).forEach(g => { gr[g] += 16; });
    if (!Object.keys(wc).length && !Object.keys(wr).length) gc[0] += 30;
  }
  fails = fails.filter(f => !f.soft);
  if (fails.length) warn.push(fails.length + ' edge label(s) overlap something; add at: or via: hints');
  const all = routes.map((r, i) => r && Object.assign(r, { e: ok[i] })).filter(Boolean);
  return { cell, box: G.box, routes: all, W: G.W, H: G.H, G };
}

<script>

function rClass(d,M,warn){
  const rowT=r=>MARK[r.st||'']+(Array.isArray(r.el)?r.el[0]:String(r.el));

  let s=routeEdges(L,r=>{
    const el=r.e.it.el, k=el.kind||'assoc', p=r.pts;
    const o=k==='comp'?{start:'dia',end:'open'}:k==='realize'?{dash:true,end:'tri'}:k==='dep'?{dash:true,end:'open'}:{end:'open'};
    let x=arrow(p,o)+labelSvg(r);
    const mu=list(el.mult), off=(a,b,dd)=>{ const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [a[0]+dx/l*dd-dy/l*10, a[1]+dy/l*dd+dx/l*10+4]; };
    if(mu[0]!=null){ const q=off(p[0],p[1],k==='comp'?28:14); x+=T(q[0],q[1],mu[0],'t-edge','middle'); }
    if(mu[1]!=null){ const q=off(p[p.length-1],p[p.length-2],20); x+=T(q[0],q[1],mu[1],'t-edge','middle'); }
    return E(st(r.e.it),x,r.e.tone);
  });
  nodes.forEach(n=>{
    const b=L.box[n.id], c=n.it.el, k=st(n.it), cx=b.x+b.w/2;
    let x=R(b.x,b.y,b.w,b.h,'box'+(k?' '+k:''),3);
    if(c.stereotype) x+=T(cx,b.y+16,'«'+c.stereotype+'»','t-stereo','middle');
    x+=T(cx,b.y+n.nameH-11,label(c),'t-name'+(k==='rm'?' t-rm':''),'middle')+line([[b.x,b.y+n.nameH],[b.x+b.w,b.y+n.nameH]]);
    let yy=b.y+n.nameH;
    const row=(r,i,cl)=>{ const rs=ST[r.st||'']; return T(b.x+10,yy+18+i*18,rowT(r),cl+(rs?' t-'+rs:'')); };
    if(n.attrs.length){ n.attrs.forEach((r,i)=>{ x+=row(r,i,'t-col'); }); yy+=n.attrs.length*18+10; x+=line([[b.x,yy],[b.x+b.w,yy]]); }
    n.ops.forEach((r,i)=>{ x+=row(r,i,'t-ops'); });
    s+=x;
  });
  return svg(L.W,L.H,'UML class diagram: '+d.title,s);
}

/* ---------- use case ---------- */
function rUse(d,M,warn){
  const sp=d.spec, A=M.actors, C=M.cases;
  const amap={}, atone={}; A.forEach(it=>{ amap[nm(it.el)]=it; atone[nm(it.el)]=toneOf(it.el,warn,'actor '+nm(it.el)); });
  const withOnly=id=>!C.some(it=>list(it.el.actor).indexOf(id)>=0)&&C.some(it=>list(it.el.with).indexOf(id)>=0);
  const side=it=>{ const a=it.el; if(a.side==='left'||a.side==='right') return a.side; return (a.kind&&a.kind!=='human')||withOnly(nm(a))?'right':'left'; };
  const RX=Math.ceil(Math.max(100,...C.map(it=>meas(label(it.el),'case')/2+22)));
  // Fallback cells: cases of left actors fill column 0, grouped by actor in model order; every other case goes to
  // column 1, on the row of the case that includes or extends it when that row is free.
  const used={}, K=(c,r)=>c+','+r, cellOf={};
  C.forEach(it=>{ if(isCell(it.el.at)){ used[K(...it.el.at)]=1; cellOf[nm(it.el)]=it.el.at; } });
  const leftCase=it=>{ const p=list(it.el.actor)[0]; return !!(p&&amap[p]&&side(amap[p])==='left'); };
  const put=(it,col,want)=>{ let r=want; while(used[K(col,r)]) r++; cellOf[nm(it.el)]=[col,r]; used[K(col,r)]=1; };
  A.forEach(a=>C.forEach(it=>{ if(!cellOf[nm(it.el)]&&leftCase(it)&&list(it.el.actor)[0]===nm(a.el)) put(it,0,0); }));
  C.forEach(it=>{
    if(cellOf[nm(it.el)]) return;
    const id=nm(it.el), src=C.find(o=>cellOf[nm(o.el)]&&(list(o.el.include).concat(list(o.el.extend)).indexOf(id)>=0||list(it.el.extend).indexOf(nm(o.el))>=0));
    put(it,1,src?cellOf[nm(src.el)][1]:0);
  });
  const nodes=C.map(it=>({id:nm(it.el),w:RX*2,h:44,at:isCell(it.el.at)?it.el.at:cellOf[nm(it.el)],it,tone:toneOf(it.el,warn,'case '+nm(it.el))}));
  const edges=[];
  C.forEach(it=>{ const c=it.el, s=it.st==='removed'?'removed':it.st;
    list(c.include).forEach(x=>edges.push({v:nm(c),w:x,lines:['«include»'],lw:Math.ceil(meas('«include»','edge')),it:{st:s}}));
    list(c.extend).forEach(x=>edges.push({v:nm(c),w:x,lines:['«extend»'],lw:Math.ceil(meas('«extend»','edge')),it:{st:s}}));
  });
  const gutterRows={};
  list(sp.bands).forEach((band,i)=>{ if(i) gutterRows[+list(band.rows)[0]||0]=64; });
  const L=layoutGraph(nodes,edges,{dir:'LR',warn,gutterW:110,gutterH:28,margin:30,gutterRows});
  const lefts=A.filter(it=>side(it)==='left'), rights=A.filter(it=>side(it)==='right');
  const AB=Math.ceil(Math.max(124,...A.filter(it=>(it.el.kind||'human')!=='human').map(it=>meas(label(it.el),'name')+24))), hb=AB/2;
  const AW=Math.max(150,AB), ox=lefts.length?AW+40:30, oy=78, bx=ox-10, by=20, bw=L.W+20, bh=oy-by+L.H+10;
  const cb=id=>{ const b=L.box[id]; return b&&{id, cx:ox+b.x+b.w/2, cy:oy+b.y+b.h/2, rx:b.w/2}; };
  let s=`<rect class="boundary" x="${bx}" y="${by}" width="${f1(bw)}" height="${f1(bh)}" rx="14"/>`;
  if(sp.system){ const t=wrap2(sp.system,'sys',bw-40); s+=T(bx+18,by+26,t[0],'t-sys'); if(t[1]) s+=T(bx+18,by+44,t[1],'t-note'); }
  list(sp.bands).forEach((band,i)=>{
    const rows=list(band.rows), r0=+rows[0]||0;
    if(i>0) s+=line([[bx,oy+L.G.gy(r0)],[bx+bw,oy+L.G.gy(r0)]],'band');
    s+=T(bx+14,oy+L.G.gy(r0)+(i?14:6),band.name||'','t-lane');
  });
  // Actors: centered on their cases, then pushed apart so none overlap.
  const placeSide=(arr,isLeft)=>{
    const ys=arr.map(it=>{ const id=nm(it.el), cs=C.filter(c=>list(c.el.actor).concat(list(c.el.with)).indexOf(id)>=0).map(c=>cb(nm(c.el))).filter(Boolean);
      return {it,y:cs.length?cs.reduce((a,c)=>a+c.cy,0)/cs.length:oy+40,cs}; });
    ys.sort((a,b)=>a.y-b.y);
    let last=-Infinity; ys.forEach(o=>{ o.y=Math.max(o.y,last+96,oy+20); last=o.y; });
    return ys.map(o=>Object.assign(o,{x:isLeft?ox-AW/2-30:bx+bw+AW/2+10,left:isLeft}));
  };
  const placed=placeSide(lefts,true).concat(placeSide(rights,false));
  let H=by+bh+20;
  // An actor line that would cut through another case runs along the row gutter above its case instead.
  const ells=nodes.map(n=>Object.assign({id:n.id},cb(n.id)));
  const cuts=(p,q,id)=>ells.some(e=>e.id!==id&&Array.from({length:24},(_,i)=>i/23).some(t=>{ const x=p[0]+(q[0]-p[0])*t, y=p[1]+(q[1]-p[1])*t; return ((x-e.cx)/e.rx)**2+((y-e.cy)/22)**2<1.05; }));
  const col0=ox+L.G.cx[0], colN=ox+L.G.cx[L.G.nc-1]+L.G.cw[L.G.nc-1];
  placed.forEach(o=>{
    const a=o.it.el, k=st(o.it), human=(a.kind||'human')==='human';
    o.cs.forEach(c=>{ const tx=o.left?c.cx-c.rx:c.cx+c.rx, sx=o.left?o.x+(human?18:hb):o.x-(human?18:hb), p=[sx,o.y-(human?10:0)];
      let pts=[p,[tx,c.cy]];
      if(cuts(p,[tx,c.cy],c.id)){ const yg=oy+L.G.gy(L.cell[c.id][1])-8, xe=o.left?col0-14:colN+14; pts=[p,[xe,yg],[c.cx,yg],[c.cx,c.cy-22]]; }
      s+=E(k==='rm'?'rm':(k==='new'?'new':''),line(pts),atone[nm(a)]); });
    const at=atone[nm(a)];
    if(human){ s+=TG(at,`<g class="actor${TC(at)}${k?' '+k:''}" transform="translate(${f1(o.x)},${f1(o.y)})"><circle cx="0" cy="-30" r="9"/><line x1="0" y1="-21" x2="0" y2="6"/><line x1="-15" y1="-12" x2="15" y2="-12"/><line x1="0" y1="6" x2="-12" y2="28"/><line x1="0" y1="6" x2="12" y2="28"/></g>`+T(o.x,o.y+46,label(a),'t-name'+(k==='rm'?' t-rm':''),'middle')); H=Math.max(H,o.y+60); }
    else { s+=TG(at,R(o.x-hb,o.y-22,AB,44,'box'+(a.kind==='external'?' ext':'')+TC(at)+(k?' '+k:''),4)+T(o.x,o.y-5,a.kind==='external'?'«external»':'«system»','t-stereo','middle')+T(o.x,o.y+11,label(a),'t-name'+(k==='rm'?' t-rm':''),'middle')); H=Math.max(H,o.y+40); }
  });
  let inner=routeEdges(L,r=>E(st(r.e.it),arrow(r.pts,{dash:true,end:'open'})+labelSvg(r)));
  nodes.forEach(n=>{ const b=L.box[n.id], k=st(n.it), cx=b.x+b.w/2, cy=b.y+b.h/2;
    inner+=`<g${n.tone?` class="tone-${n.tone}"`:''}><title>${esc(nm(n.it.el))}</title><ellipse class="box${TC(n.tone)}${k?' '+k:''}" cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(b.w/2)}" ry="${f1(b.h/2)}"/>`+T(cx,cy+4,label(n.it.el),'t-case'+(k==='rm'?' t-rm':''),'middle')+`</g>`; });
  s+=`<g transform="translate(${ox},${oy})">${inner}</g>`;
  const W=rights.length?bx+bw+AW+30:bx+bw+30;
  return svg(W,H,'Use case diagram: '+d.title,s);
}

/* ---------- sequence: evenly spaced lifelines, labels in at most two lines ---------- */
function rSeq(d,M,warn){
  const parts=M.participants, idx={}; parts.forEach((p,i)=>idx[nm(p.el)]=i);
  const msgs=M.messages.filter(it=>{ const ok=it.el.from in idx&&it.el.to in idx; if(!ok) warn.push('message '+it.key+': unknown participant, not drawn'); return ok; });
  // Two balanced lines; a long unbreakable token (a URL, a DID) splits at : / . so one step cannot widen every gap.
  const lab=msgs.map((it,i)=>{ const t=(i+1)+' '+(it.el.text||''), ls=wrap2(t,'edge',150);
    return linesW(ls,'edge')>190?wrapN(t,'edge',Math.max(150,Math.ceil(meas(t,'edge')/2)+12),2):ls; });
  // Even gaps sized for the labels, capped at 200 px; a longer label spills past its lifelines and the canvas grows to fit.
  let need=150;
  msgs.forEach((it,i)=>{ const m=it.el; if(m.from===m.to) return; const span=Math.abs(idx[m.to]-idx[m.from]); need=Math.max(need,(linesW(lab[i],'edge')+28)/span); });
  const sp=Math.ceil(Math.max(Math.min(need,200),...parts.map(p=>meas(label(p.el),'name')+40)));
  let lo=0, hi=(parts.length-1)*sp;
  msgs.forEach((it,i)=>{ const m=it.el; if(m.from===m.to) return; const c=(idx[m.from]+idx[m.to])/2*sp, h=linesW(lab[i],'edge')/2; lo=Math.min(lo,c-h); hi=Math.max(hi,c+h); });
  const x0=Math.ceil(Math.max(80,sp/2+10,12-lo)), X=i=>x0+i*sp, hw=Math.min(sp-24,Math.max(110,...parts.map(p=>meas(label(p.el),'name')+28)));
  let y=64, body='', W=Math.max(x0+(parts.length-1)*sp+x0,x0+hi+12);
  msgs.forEach((it,i)=>{
    const m=it.el, xa=X(idx[m.from]), xb=X(idx[m.to]), k=m.kind||'call', ls=lab[i];
    const o=k==='return'?{dash:true,end:'open'}:k==='async'?{end:'open'}:{end:'fill'};
    let s='';
    if(m.from===m.to){
      y+=10;
      s+=arrow([[xa,y],[xa+26,y],[xa+26,y+16],[xa+2,y+16]],o);
      ls.forEach((l,j)=>{ s+=T(xa+34,y+10+j*13,l,'t-edge'); });
      W=Math.max(W,xa+34+linesW(ls,'edge')+16);
      y+=Math.max(26,ls.length*13+10)+14;
    } else {
      y+=ls.length*13+12;
      ls.forEach((l,j)=>{ s+=T((xa+xb)/2,y-6-(ls.length-1-j)*13,l,'t-edge','middle'); });
      s+=arrow([[xa,y],[xb,y]],o);
      y+=14;
    }
    body+=E(st(it),s,toneOf(m,warn,'message '+it.key));
  });
  const H=y+20;
  let head='';
  parts.forEach((p,i)=>{ const x=X(i), k=st(p), pt=toneOf(p.el,warn,'participant '+nm(p.el));
    head+=line([[x,50],[x,H-8]],'life')+TG(pt,R(x-hw/2,16,hw,34,'box'+TC(pt)+(k?' '+k:''),3)+T(x,38,label(p.el),'t-name'+(k==='rm'?' t-rm':''),'middle')); });
  return svg(W,H,'Sequence diagram: '+d.title,head+body);
}

const RENDER={class:rClass,erd:rErd,state:rState,component:rComp,usecase:rUse,sequence:rSeq};
const TYPE={class:'Class',erd:'Entity relationship',state:'State machine',component:'Component',usecase:'Use case',sequence:'Sequence'};
const CAPTION={
  component:'Boxes are deployable parts; frames are lanes. Solid arrows are calls or data flow; dashed arrows are indirect links. Shaded boxes are «external».',
  erd:'Crow’s feet mark the many side, a circle marks zero or optional, double bars mark exactly one. Rows marked + are new, ~ changed, - removed.',
  sequence:'Time runs down. Filled arrowheads are calls, dashed arrows are replies, open arrowheads are asynchronous notices.',
  state:'The filled dot is the start; the ringed dot is the end. Brackets hold a guard condition.',
  usecase:'Ellipses are use cases inside the system boundary; actors sit outside it. Dashed arrows are «include» and «extend».',
  class:'Diamonds mark composition, hollow triangles realization, dashed open arrows dependency. Numbers at the ends are multiplicities.'
};
const COUNT={component:['Nodes','nodes'],erd:['Tables','tables'],sequence:['Steps','messages'],state:['States','states'],usecase:['Cases','cases'],class:['Classes','classes']};

/* ---------- page ---------- */
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
function prose(md){
  const paras=String(md||'').split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p&&!/^#/.test(p));
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const table=ls=>{ const rows=ls.filter(l=>!/^\s*\|[\s:|-]+\|\s*$/.test(l)).map(cells);
    return '<div class="tablewrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
      rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'; };
  return paras.map(p=>{ const ls=p.split('\n');
    if(ls.length>1&&ls.every(l=>/^\s*\|/.test(l))) return table(ls);
    return ls.every(l=>/^\s*[-*] /.test(l)) ? '<ul>'+ls.map(l=>'<li>'+inline(l.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>' : '<p>'+inline(ls.join(' '))+'</p>'; }).join('');
}
const TAGTXT={new:'new',chg:'changed',rm:'removed'};
const tag = s => s ? `<span class="tag ${s}">${TAGTXT[s]}</span>` : '';
const sid = id => 'd-'+String(id).replace(/[^A-Za-z0-9_-]/g,'_');
const pad = n => String(n).padStart(2,'0');
const dl = rows => '<dl>'+rows.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`).join('')+'</dl>';

function main(){
  const curEl=$('uml-cur'), baseEl=$('uml-base'), ref=baseEl.dataset.ref;
  const out=$('sheets');
  if(!window.jsyaml){ out.innerHTML='<p class="err">Could not load js-yaml from cdnjs.cloudflare.com.</p>'; return; }
  const cur=parseModel(curEl.textContent,jsyaml.load);
  const base=ref?parseModel(baseEl.textContent,jsyaml.load):null;
  const delta=diffModels(base,cur);
  const title=cur.title||'System design', rev=cur.rev;
  const cnt={new:0,changed:0,removed:0}; delta.list.forEach(x=>cnt[x.st]++);
  const sheets=[];
  const errs=cur.errors.map(e=>'current: '+e).concat(base?base.errors.map(e=>'base: '+e):[]);
  if(errs.length) sheets.push({id:'errors',nav:'Errors',lvl:'Errors',title:'Model errors',facts:[],body:`<p class="err">${esc(errs.join('\n'))}</p>`});
  delta.sheets.forEach(sh=>{
    const d=sh.d, warn=[], s=ST[sh.st];
    let fig;
    try{ fig=RENDER[d.type](d,sh.merged,warn); }catch(e){ fig=''; warn.push('render failed: '+e.message); }
    const mine=delta.list.filter(x=>x.diagram===d.id&&x.kind!=='diagram');
    const review=d.review.length?`<div><h3>Check here</h3><ul>${d.review.map(r=>`<li>${inline(r)}</li>`).join('')}</ul></div>`:'';
    const changes=mine.length?`<div><h3>Changes</h3><ul class="delta">${mine.map(x=>`<li>${tag(ST[x.st])}<span><code>${esc(x.kind+' '+x.key)}</code>${x.name&&x.name!==x.key?' '+esc(x.name):''}${x.detail.length?' <code>'+esc(x.detail.join(', '))+'</code>':''}</span></li>`).join('')}</ul></div>`:'';
    const c=COUNT[d.type], n=(sh.merged[c[1]]||[]).filter(it=>it.st!=='removed').length;
    sheets.push({id:sid(d.id),nav:d.title,lvl:(d.level?d.level+' · ':'')+TYPE[d.type],title:d.title,st:s,
      facts:[[c[0],String(n)]],
      body:(d.note.trim()?`<div class="note">${prose(d.note)}</div>`:'')+
        (warn.length?`<p class="err">${esc(warn.join('\n'))}</p>`:'')+
        `<figure><div class="canvas">${fig}</div><figcaption>${d.caption?esc(String(d.caption)):CAPTION[d.type]}</figcaption></figure>`+
        (review||changes?`<div class="review">${review}${changes}</div>`:'<div style="height:24px"></div>')});
  });
  cur.sections.forEach((s,i)=>sheets.push({id:'prose-'+i,nav:s.title,lvl:'Notes',title:s.title,facts:[],body:`<div class="note" style="padding-bottom:24px">${prose(s.body)}</div>`}));
  const N=sheets.length;
  const facts=[['Source',`<code>${esc(curEl.dataset.model)}</code>`],['Base',ref?`<code>${esc(ref)}</code>`:'none'],['Sheets',String(N)]];
  if(rev) facts.unshift(['Revision',esc(rev)]);
  if(ref) facts.push(['Delta',`${cnt.new} new, ${cnt.changed} changed, ${cnt.removed} removed`]);
  const cover=`<section class="cover" id="cover"><div><div class="lvl">System design drawing set${rev?' · Rev '+esc(rev):''}</div><h1>${esc(title)}</h1></div>`+
    (cur.intro?`<div class="dek">${prose(cur.intro)}</div>`:'')+
    `<dl class="facts">${facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>`+
    `<div class="legend" aria-label="Legend"><span><i class="sw new"></i>new</span><span><i class="sw chg"></i>changed</span><span><i class="sw rm"></i>removed (struck through)</span><span><i class="sw ext"></i>«external» system</span><span><i class="sw"></i>unchanged</span></div>`+
    (cur.decided.length?`<div class="ask"><h2>Decided${rev?' in rev '+esc(rev):''}</h2><ol>${cur.decided.map(x=>`<li>${inline(x)}</li>`).join('')}</ol></div>`:'')+`</section>`;
  $('idx').innerHTML=`<div class="k">Drawing set${rev?' · Rev '+esc(rev):''}</div><a href="#cover"><span class="no">00</span><span>Cover</span><span></span></a>`+
    sheets.map((s,i)=>`<a href="#${s.id}"><span class="no">${pad(i+1)}</span><span>${esc(s.nav)}</span>${tag(s.st)||'<span></span>'}</a>`).join('');
  out.innerHTML=cover+sheets.map((s,i)=>{
    const meta=[['Sheet',`${pad(i+1)} / ${pad(N)}`]].concat(rev?[['Rev',esc(rev)]]:[],s.facts.map(f=>[f[0],esc(f[1])]),[['Delta',ref?(tag(s.st)||'<span class="tag same">none</span>'):'no base']]);
    return `<section class="sheet${s.st==='rm'?' s-rm':''}" id="${s.id}"><header class="tb"><div class="title"><div class="lvl">${esc(s.lvl)}</div><h2>${esc(s.title)}</h2></div>${dl(meta)}</header>${s.body}</section>`;
  }).join('');
  const links=[...document.querySelectorAll('.index a')];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting) links.forEach(a=>a.classList.toggle('cur',a.hash==='#'+en.target.id)); }); },{rootMargin:'-40% 0px -55% 0px'});
    document.querySelectorAll('section.sheet,section.cover').forEach(s=>io.observe(s));
  }
}
const run=()=>{ try{ main(); }catch(e){ $('sheets').innerHTML='<p class="err">'+esc(e.stack||e)+'</p>'; } };
// Measure with the web fonts once they load; draw anyway after 3 s (offline, blocked fonts).
fonts();
const load=document.fonts&&document.fonts.load?Promise.all(Object.values(FONT).map(f=>document.fonts.load(f).catch(()=>0))):Promise.resolve();
Promise.race([load,new Promise(r=>setTimeout(r,3000))]).then(run);
})();
</script>
